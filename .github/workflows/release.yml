# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the daemon image to ghcr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Derive the image tag from the RAW ref, not docker/metadata-action's
      # type=semver. The suite tags releases zero-padded and non-semver
      # (v00.01.00b1). type=semver,pattern={{version}} SILENTLY DROPS such a tag
      # and would publish only :latest. Stripping the leading v from the ref name
      # (${GITHUB_REF_NAME#v}) and feeding it as type=raw yields
      # ghcr.io/tagwright/beacon:00.01.00b1 (and a plain vX.Y.Z tag yields
      # :X.Y.Z). See the Build Playbook release-tag trap.
      - name: Derive image tag from raw ref
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tagwright/beacon
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest

      - name: Build and push daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile build stage sets ENV GOPRIVATE=github.com/tagwright/*
          # so the image build fetches core and courier from source; passing it
          # again here as a build-arg keeps the fetch working even if the
          # Dockerfile ever switches to an ARG-driven value.
          build-args: |
            GOPRIVATE=github.com/tagwright/*

# One-time after the first successful publish: flip the ghcr package
# ghcr.io/tagwright/beacon from private to public (GitHub -> tagwright org ->
# Packages -> beacon -> Package settings -> Change visibility -> Public), the
# same one-time step aboard, ballast, berm, and the other suite images needed.
# Later publishes to the same package inherit the public visibility.
